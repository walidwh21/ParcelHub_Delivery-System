spring.application.name=ParcelHub

# thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# PostgresSQL database credential
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parcelhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Local storage
storage.local.path=${UPLOAD_PATH:uploads}

# Remember me cookie secret key
server.servlet.session.tracking-modes=cookie
parcelhub.security.remember-me.key=${REMEMBER_ME_KEY}

## SSLCommerz configuration
sslcommerz.base-url=${GATEWAY_CALLBACK_BASE_URL:http://localhost:8080}
sslcommerz.store-id=${GATEWAY_STORE_ID:}
sslcommerz.store-passwd=${GATEWAY_STORE_PASSWORD:}
sslcommerz.validation-url=${GATEWAY_VALIDATION_URL:https://sandbox.sslcommerz.com}
sslcommerz.init-url=${GATEWAY_INIT_URL:https://sandbox.sslcommerz.com/gwprocess/v3/api.php}

## flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging configuration
logging.file.path=logs
logging.level.root=INFO

# Tracing configuration
tracing.url=${TRACING_URL:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Promethues
management.endpoints.web.exposure.include=health,info,prometheus

# Loki
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}
application.base.url=${APPLICATION_BASE_URL:http://localhost:8080}

## seeded administrator (see V8 migration); supply via environment
spring.flyway.placeholders.admin_email=${ADMIN_EMAIL:admin@example.com}
spring.flyway.placeholders.admin_password_hash=${ADMIN_PASSWORD_HASH:{bcrypt}$2a$10$invalidinvalidinvalidinvalidinvalidinvalidinvalidinvalidi}

## shipping price model (BDT)
parcelhub.pricing.base-charge=100
parcelhub.pricing.per-size-unit=0.2
parcelhub.pricing.per-weight-unit=0.4
